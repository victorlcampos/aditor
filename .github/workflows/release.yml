name: Release CLI
run-name: Build and release · ${{ github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "${{ matrix.target }}"
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ matrix.target }}-${{ steps.rust.outputs.version }}-
      - name: Set release version
        run: |
          base_version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')
          echo "ADITOR_RELEASE_VERSION=${base_version}+build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked --target "${{ matrix.target }}"
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --target "${{ matrix.target }}" -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package and smoke test
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@v6
        with:
          name: aditor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Summarize build
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### $RELEASE_TARGET"
            echo "Version: \`$ADITOR_RELEASE_VERSION\`"
            echo ""
            echo "Formatting, tests, Clippy, release build, and CLI smoke checks passed."
            echo ""
            echo '```text'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          pattern: aditor-*
          path: dist
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          cat ./*.sha256 | tr -d '\r' > SHA256SUMS
          sha256sum --check SHA256SUMS
          version=$(cat version-*.txt | tr -d '\r' | sort -u)
          test "$(printf '%s\n' "$version" | wc -l)" -eq 1
          tag="v${version}"
          python ../scripts/release-notes.py "$version" > release-notes.md
          if gh release view "$tag" --json isDraft --jq '.isDraft' > is-draft.txt; then
            if [ "$(cat is-draft.txt)" = false ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Aditor $tag" \
              --notes-file release-notes.md --generate-notes \
              --draft
          fi
          gh release upload "$tag" ./*.tar.gz ./*.zip SHA256SUMS --clobber
          latest=false
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')" = "$GITHUB_SHA" ]; then
            latest=true
          fi
          gh release edit "$tag" --draft=false --latest="$latest"
          {
            cat release-notes.md
            echo ""
            echo "[View this release](https://github.com/$GH_REPO/releases/tag/$tag) · [Download latest](https://github.com/$GH_REPO/releases/latest)"
          } >> "$GITHUB_STEP_SUMMARY"
