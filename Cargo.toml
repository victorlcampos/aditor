[package]
name = "aditor"
version = "0.1.0"
edition = "2021"
description = "Agentic Editor — CLI rápido para cortes/aceleração de vídeo (binário único, self-contained)"
license = "MIT"

[features]
embed-ffmpeg = []

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "6"
ffmpeg-sidecar = { version = "2", features = ["download_ffmpeg"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
base64 = "0.22"
ureq = { version = "3", default-features = false }
